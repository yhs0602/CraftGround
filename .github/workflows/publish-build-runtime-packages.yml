name: Runtime packages

on: [workflow_call]

env:
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-runtime-packages
  cancel-in-progress: true

jobs:
  build_runtime_packages:
    name: Build ${{ matrix.runtime }} runtime package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [mc121, mc262, mc263]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Build sdist and wheel
      run: pipx run build --outdir ${{ github.workspace }}/dist
      working-directory: minecraft/${{ matrix.runtime }}

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-runtime-${{ matrix.runtime }}
        path: dist/*
