pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Java 25 isn't installed on most developer/CI machines yet; the foojay resolver lets
// Gradle provision it automatically via the toolchain instead of requiring a manual install.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'minecraftenv-mc262'
