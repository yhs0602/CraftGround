# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0-SNAPSHOT
maven_group=com.yhs0602
archives_base_name=craftground

# Dependencies
fabric_api_version=0.155.2+26.2

# Kotlin 2.0.0 doesn't support a JVM_TARGET of 25 yet (falls back to 22), which otherwise
# fails Gradle's strict compileJava(25)/compileKotlin(22) target-compatibility check. The
# mismatched bytecode versions still load fine together on a Java 25 JVM.
kotlin.jvm.target.validation.mode=warning
